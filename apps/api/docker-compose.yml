name: rails-auth-api-sample
services:
  api:
    build:
      context: .
    command: bash -c "rm -f tmp/pids/server.pid && ./bin/rails db:prepare && bundle exec puma -C config/puma.rb"
    ports:
      - '8080:3000'
      - '8443:3443'
    volumes:
      - .:/rails
      - ../../.certificate:/rails/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      RAILS_ENV: development
      DATABASE_URL: mysql2://root:password@db:3306/app_development
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SSL_PORT: ${SSL_PORT}
      SSL_KEY_PATH: ${SSL_KEY_PATH}
      SSL_CERT_PATH: ${SSL_CERT_PATH}

  db:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: app_development
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - '8081:8080'
    volumes:
      - ./docs:/usr/share/nginx/html/docs
    environment:
      URLS: "[{ url: '/docs/openapi.yaml', name: 'Rails Auth API' }]"

volumes:
  db-data:
  redis-data:
